name: CI

on:
  pull_request:
  push:
    branches: [main, "arena/*"]

permissions:
  contents: read

jobs:
  check:
    name: Syntax, tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run npm check
        run: npm run check
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Verify service worker cache list
        run: node -e "const s=require('fs').readFileSync('service-worker.js','utf8'); const m=s.match(/const SHELL = \\[([\\s\\S]*?)\\];/); if(!m) process.exit(1); console.log('shell entries:', (m[1].match(/\"/g)||[]).length/2);"
