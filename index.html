<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <meta name="description" content="Protótipo jogável de sobrevivência zumbi em Umbral Realm.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <title>Umbral Realm — Protótipo jogável</title>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand"><span class="sigil">✦</span><div><strong>UMBRAL REALM</strong><small>Sobreviva à trilha • BUILD 12</small></div></div>
      <div class="player-stats"><span id="level">Nv. 1</span><span id="coins">◈ 0</span></div>
    </header>
    <section class="hud" aria-label="Status do personagem">
      <div class="health-row"><span>VITALIDADE</span><span id="hp-label">100 / 100</span></div>
      <div class="meter"><div id="hp-bar" class="meter-fill hp"></div></div>
      <div class="health-row xp-label"><span>EXPERIÊNCIA</span><span id="xp-label">0 / 100 XP</span></div>
      <div class="meter xp"><div id="xp-bar" class="meter-fill"></div></div>
    </section>
    <section id="game-wrap" aria-label="Mundo do jogo">
      <div id="game"></div>
      <div class="location-pill"><span class="dot"></span><span>Trilha Velha</span></div>
      <div class="enemy-panel"><div class="enemy-title"><span id="enemy-label">RATO ZUMBI</span><span id="enemy-hp-label">70 / 70</span></div><div class="meter enemy-meter"><div id="enemy-hp-bar" class="meter-fill enemy-fill"></div></div></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </section>
    <section class="bottom-panel">
      <div class="quest"><span class="quest-mark">!</span><div><small>OBJETIVO DO TESTE</small><strong id="quest-text">Derrote o rato zumbi e receba sua recompensa.</strong></div></div>
      <div class="weapon-status"><span id="combat-info">Ação próxima selecionada</span><span id="charge-label">Energia: 7 / 7</span></div>
      <div class="controls">
        <div class="dpad" aria-label="Movimento">
          <button class="pad up" data-dir="up" aria-label="Mover para cima">▲</button>
          <button class="pad left" data-dir="left" aria-label="Mover para esquerda">◀</button>
          <button class="pad down" data-dir="down" aria-label="Mover para baixo">▼</button>
          <button class="pad right" data-dir="right" aria-label="Mover para direita">▶</button>
        </div>
        <div class="actions">
          <div class="weapon-select"><button id="action-close" class="weapon selected" aria-pressed="true">PRÓXIMA</button><button id="action-far" class="weapon" aria-pressed="false">DISTANTE</button></div>
          <button id="interact" class="action secondary">FALAR</button>
          <button id="attack" class="action danger"><span>✦</span><small>AGIR</small></button>
        </div>
      </div>
      <footer><span id="status">Aproxime-se do rato zumbi para usar a ação próxima.</span><button id="save" class="save">SALVAR</button></footer>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="./src/game.js?v=12"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=12').catch(()=>{}));</script>
</body>
</html>
