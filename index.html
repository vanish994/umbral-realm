<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <meta name="description" content="Explore um mundo de fantasia sombria em Umbral Realm.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <title>Umbral Realm</title>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand"><span class="sigil">✦</span><div><strong>UMBRAL REALM</strong><small>As Terras Esquecidas</small></div></div>
      <div class="player-stats"><span id="level">Nv. 1</span><span id="coins">◈ 0</span></div>
    </header>
    <section class="hud" aria-label="Status do personagem">
      <div class="health-row"><span>VITALIDADE</span><span id="hp-label">100 / 100</span></div>
      <div class="meter"><div id="hp-bar" class="meter-fill hp"></div></div>
      <div class="health-row xp-label"><span>EXPERIÊNCIA</span><span id="xp-label">0 / 100 XP</span></div>
      <div class="meter xp"><div id="xp-bar" class="meter-fill"></div></div>
    </section>
    <section id="game-wrap" aria-label="Mundo do jogo">
      <div id="game"></div>
      <div class="location-pill"><span class="dot"></span><span id="location">Bosque das Cinzas</span></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </section>
    <section class="bottom-panel">
      <div class="quest"><span class="quest-mark">!</span><div><small>RUMOR LOCAL</small><strong id="quest-text">Encontre Edrin perto da velha trilha.</strong></div></div>
      <div class="controls">
        <div class="dpad" aria-label="Movimento">
          <button class="pad up" data-dir="up" aria-label="Mover para cima">▲</button>
          <button class="pad left" data-dir="left" aria-label="Mover para esquerda">◀</button>
          <button class="pad down" data-dir="down" aria-label="Mover para baixo">▼</button>
          <button class="pad right" data-dir="right" aria-label="Mover para direita">▶</button>
        </div>
        <div class="actions"><button id="interact" class="action secondary">FALAR</button><button id="attack" class="action danger"><span>⚔</span><small>ATACAR</small></button></div>
      </div>
      <footer><span id="status">O vento traz cinzas do norte.</span><button id="save" class="save">SALVAR</button></footer>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="./src/game.js"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script>
</body>
</html>
